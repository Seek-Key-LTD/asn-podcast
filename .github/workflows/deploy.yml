name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # 迁移必须排在两次 deploy 之前：迁移失败时 CI 在部署前就断了，线上仍跑旧代码
      # + 旧 schema，零影响；反过来会出现「DB 已新 schema、代码还读旧结构」的窗口。
      # `db:migrate` 里显式写了 --remote——依赖 wrangler 的默认目标是灾难级的。
      - name: Apply D1 migrations
        run: pnpm db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: pnpm deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Web App
        # 必须写 `pnpm run deploy`：裸 `pnpm deploy` 会被 pnpm 的内置 deploy 命令
        # 截胡，报 ERR_PNPM_NOTHING_TO_DEPLOY，永远部署不到 web app。
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NODE_ENV: production
